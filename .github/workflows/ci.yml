name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  core:
    name: Testes core (determinísticos)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executa os testes core
        run: mvn -B test -DexcludedGroups=external,unstable

      - name: Publica relatórios (MD + PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-api-reports-core
          path: target/dog-api-reports/
          if-no-files-found: warn

  full:
    name: Suíte completa (inclui external/unstable)
    runs-on: ubuntu-latest
    needs: core
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executa a suíte completa
        run: mvn -B test

      - name: Publica relatórios (MD + PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-api-reports-full
          path: target/dog-api-reports/
          if-no-files-found: warn